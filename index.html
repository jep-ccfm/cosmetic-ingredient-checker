<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화장품 패키지 문안 검수기</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <h1 class="title">화장품 패키지<br />문안 검수기</h1>
      <hr class="divider" />

      <label class="field-label">① 기준 문안 PDF <span class="tag ok">정답</span></label>
      <label class="file-btn" for="ref-input">기준 문안 선택</label>
      <input id="ref-input" type="file" accept="application/pdf" hidden />
      <p id="ref-name" class="file-name">선택된 파일 없음</p>

      <label class="field-label">② 디자인 PDF <span class="tag err">검수 대상</span></label>
      <label class="file-btn" for="target-input">디자인 파일 선택</label>
      <input id="target-input" type="file" accept="application/pdf" hidden />
      <p id="target-name" class="file-name">선택된 파일 없음</p>

      <button id="analyze-btn" class="analyze-btn">검수 시작</button>
      <p class="hint">두 PDF를 내용(문구) 기준으로 대조합니다. 위치가 달라도, 이미지가 회전/저해상도여도 자동으로 판독합니다. 이미지는 검수 시에만 서버를 거쳐 전송되며 API 키는 서버에만 보관됩니다.</p>
    </aside>

    <!-- 콘텐츠 -->
    <main class="content">
      <p id="status" class="status">기준 문안 PDF와 디자인 PDF를 선택한 후 [검수 시작]을 누르세요.</p>

      <div class="tabs">
        <button class="tab active" data-tab="result">검수 결과</button>
        <button class="tab" data-tab="ref">기준 문안 텍스트</button>
        <button class="tab" data-tab="target">디자인 텍스트</button>
      </div>

      <section id="tab-result" class="tab-panel active"></section>
      <section id="tab-ref" class="tab-panel"></section>
      <section id="tab-target" class="tab-panel"></section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
