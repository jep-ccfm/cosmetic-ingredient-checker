<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화장품 패키지 문안 검수기</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <h1 class="title">화장품 패키지<br />문안 검수기</h1>
      <hr class="divider" />

      <!-- ① 기준 문안 -->
      <label class="field-label">① 기준 문안 <span class="tag ok">정답</span></label>
      <label class="file-btn" for="ref-input">파일 선택 (PDF·이미지)</label>
      <input id="ref-input" type="file" accept=".pdf,image/*" hidden />
      <p id="ref-name" class="file-name">선택된 파일 없음</p>
      <div class="or">또는 링크</div>
      <input id="ref-url" class="url-input" type="text" placeholder="구글 시트/드라이브/URL 링크" />

      <!-- ② 디자인 -->
      <label class="field-label">② 디자인 <span class="tag err">검수 대상</span></label>
      <label class="file-btn" for="target-input">파일 선택 (PDF·이미지)</label>
      <input id="target-input" type="file" accept=".pdf,image/*" hidden />
      <p id="target-name" class="file-name">선택된 파일 없음</p>
      <div class="or">또는 링크</div>
      <input id="target-url" class="url-input" type="text" placeholder="구글 드라이브/URL 링크" />

      <button id="analyze-btn" class="analyze-btn">검수 시작</button>
      <p class="hint">PDF 권장 · 이미지(jpg/png)와 링크도 가능. 링크는 <b>‘링크가 있는 모든 사용자–보기’로 공개 공유</b>된 파일만 읽힙니다. 파일과 링크를 모두 넣으면 <b>링크가 우선</b>합니다. 위치가 달라도, 회전/저해상도여도 자동 판독하며 API 키는 서버에만 보관됩니다.</p>
    </aside>

    <!-- 콘텐츠 -->
    <main class="content">
      <p id="status" class="status">① 기준 문안과 ② 디자인을 넣은 후 [검수 시작]을 누르세요.</p>

      <div class="tabs">
        <button class="tab active" data-tab="result">검수 결과</button>
        <button class="tab" data-tab="ref">기준 문안 텍스트</button>
        <button class="tab" data-tab="target">디자인 텍스트</button>
      </div>

      <section id="tab-result" class="tab-panel active"></section>
      <section id="tab-ref" class="tab-panel"></section>
      <section id="tab-target" class="tab-panel"></section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
